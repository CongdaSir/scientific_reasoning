model:
  provider: vllm
  base_url: http://localhost:8001/v1
  name: Qwen/Qwen3-8B
  api_key_env: VLLM_API_KEY
  timeout: 300
  max_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  enable_thinking: true

search:
  endpoint: https://api.deepseek.com/v1/tools/search
  api_key_env: DEEPSEEK_API_KEY
  timeout: 60
  need_content: false

code:
  timeout: 30
  auto_install: true
  install_timeout: 300

reasoning:
  max_rounds: 20

dataset:
  question_field: question
  id_field: id
  concurrency: 4
